name: Deploy to NAS

# CIが成功したときだけ走らせる。壊れたコードがNASに流れないようにするため、
# push ではなく workflow_run でCIの結果を待つ。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # 手動でも流せるようにしておく(NASを復旧させたいときなど)
  workflow_dispatch:

concurrency:
  group: deploy-nas
  cancel-in-progress: false

jobs:
  deploy:
    name: NASを更新
    # NAS上のself-hosted runnerで動く(クラウドのランナーからはNASに到達できないため)
    runs-on: [self-hosted, nas]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run の場合、CIが通ったコミットをそのまま配る
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # 起動確認もスクリプトの中で行う。runnerはコンテナの中で動いているため、
      # ここで直接curlするとlocalhostがrunner自身を指してNASのポートに届かない。
      - name: 配置して再起動
        run: bash scripts/deploy-nas.sh "$GITHUB_WORKSPACE"
